apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubeflow-pipelines
  namespace: argo-cd
spec:
  generators:
  - list:
      elements:
      - cluster: mesh-1
      - cluster: mesh-2
      - cluster: single-region
  template:
    metadata:
      name: 'kubeflow-pipelines-{{cluster}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/hahahannes/example-ml-infra.git
        targetRevision: main
        path: cluster/base-charts/kubeflow-pipelines
        plugin:
          env:
            - name: KUSTOMIZE_ARGS
              value: overlays/default
      destination:
        name: '{{cluster}}'
        # the KFP manifests hardcode the kubeflow namespace
        namespace: 'kubeflow'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # the argo workflows CRDs are too big for client-side apply
          - ServerSideApply=true
