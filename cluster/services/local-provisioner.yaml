apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: local-provisioner
  namespace: argo-cd
spec:
  generators:
  - list:
      elements:
      - cluster: mesh-1
      - cluster: mesh-2
      - cluster: single-region
  template:
    metadata:
      name: 'local-provisioner-{{cluster}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/hahahannes/example-ml-infra.git
        targetRevision: main
        path: cluster/base-charts/local-provisioner
        plugin: 
          env:
            - name: HELM_ARGS
              value: -f values.yaml
      destination:
        name: '{{cluster}}'
        namespace: 'local-provisioner'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
